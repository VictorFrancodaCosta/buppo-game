<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BUPPO</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/effects.css">

    <link rel="icon" type="image/png" href="assets/img/logo_buppo.webp">

    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">

    <link rel="apple-touch-icon" href="assets/img/logo_buppo.webp">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BUPPO">
    
    </head>
<body>
    <div id="loading-screen">
        <div class="loader-title">BUPPO</div>
        <div class="loader-bar-bg"><div class="loader-bar-fill" id="loader-fill"></div></div>
        <div class="loader-txt">CARREGANDO RECURSOS...</div>
    </div>

    <div id="transition-overlay">
        <img src="assets/img/logo_buppo.webp" class="trans-logo">
        <div class="trans-text">PREPARANDO BATALHA...</div>
    </div>

    <div id="game-background"></div>
    <div id="game-container">
        <div id="start-screen" class="screen active">
            <div class="start-bg-layer"></div>
            <img src="assets/img/logo_buppo.webp" alt="BUPPO LOGO" class="game-logo">
            <button id="btn-login" onclick="googleLogin()"><span id="btn-text">LOGIN COM GOOGLE</span></button>
            <p id="login-status" style="color: #888; font-family: 'Montserrat'; font-size: 12px; margin-top:-20px;"></p>
        </div>

        <div id="lobby-screen" class="screen">
            <div class="lobby-logo-right">
                <img src="assets/img/logo_buppo.webp" style="width:100%; height:auto;">
            </div>
            
            <div class="lobby-frame-container">
                <img src="assets/img/bg_saguao.webp" class="lobby-frame-img">
                
                <div class="lobby-ui-overlay">
                    <div class="user-welcome" id="lobby-username">OLÁ, JOGADOR</div>
                    </div>
            </div>
        </div>

        <div id="deck-selection-screen" class="screen">
           <img src="assets/img/ui_placa_selecao.webp" alt="Selecione seu Deck" class="img-titulo-placa">
            
            <div class="deck-options-container">
                <div class="deck-option" onclick="selectDeck('knight')" data-name="Forjado pela honra, guiado pela espada">
                    <img src="assets/img/card_selecao_cavaleiro.webp" alt="Deck Cavaleiro">
                </div>
                <div class="deck-option" onclick="selectDeck('mage')" data-name="Magia em estado puro">
                    <img src="assets/img/card_selecao_mago.webp" alt="Deck Mago">
                </div>
            </div>
            
            <button class="return-btn" onclick="playNavSound(); window.goToLobby()">VOLTAR AO SAGUÃO</button>
        </div>

        <div id="game-screen" class="screen">
            <div id="p-deck-container">
                <img src="assets/img/deck_verso_cavaleiro.webp" alt="Deck" id="p-deck-img">
                <div class="deck-count" id="p-deck-count">30</div>
            </div>
            </div>
    </div>

    <script src="js/effects.js"></script> 
    <script type="module" src="js/main.js"></script> 
</body>
</html>
