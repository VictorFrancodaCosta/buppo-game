name: BUPPO Desktop Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run dist:win:installer
      - uses: actions/upload-artifact@v4
        with:
          name: buppo-windows-unsigned
          path: dist-desktop/*.exe
          if-no-files-found: error
          retention-days: 14
